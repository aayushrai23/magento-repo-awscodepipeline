name: Deploy Magento to EC2 (Direct SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials (ONLY if using AWS services)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3️⃣ Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 4️⃣ Sync Magento code to EC2
      - name: Sync code to EC2
        run: |
          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/magento2/

      # 5️⃣ Run Magento post-deploy commands
      - name: Run Magento commands
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/magento2

            sudo chown -R www-data:www-data .

            sudo -u www-data php bin/magento setup:upgrade
            sudo -u www-data php bin/magento cache:flush
            sudo -u www-data php bin/magento indexer:reindex

            sudo systemctl reload nginx
          EOF
