name: Deploy Magento to EC2 (Tar over SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 3️⃣ Create Magento deployment archive (SAFE for CI)
      - name: Create Magento archive
        run: |
          tar \
            --ignore-failed-read \
            --warning=no-file-changed \
            --exclude=.git \
            --exclude=.github \
            --exclude=var \
            --exclude=pub/media \
            --exclude=pub/static \
            --exclude=vendor \
            -czf magento.tar.gz .

      # 4️⃣ Upload archive to EC2
      - name: Upload archive to EC2
        run: |
          scp magento.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/magento.tar.gz

      # 5️⃣ Extract, fix permissions & deploy
      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            sudo mkdir -p /var/www/magento2
            sudo tar -xzf /tmp/magento.tar.gz -C /var/www/magento2

            sudo chown -R www-data:www-data /var/www/magento2

            cd /var/www/magento2

            sudo -u www-data php bin/magento setup:upgrade
            sudo -u www-data php bin/magento cache:flush
            sudo -u www-data php bin/magento indexer:reindex

            sudo systemctl reload nginx

            rm -f /tmp/magento.tar.gz
          EOF
