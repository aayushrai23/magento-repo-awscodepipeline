name: Deploy Magento to EC2 (Direct SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials (ONLY if using AWS services)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3️⃣ Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 4️⃣ Sync Magento code to EC2 (SAFE RSYNC)
      - name: Sync code to EC2
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="var/*" \
            --exclude="pub/media/*" \
            --exclude="pub/static/*" \
            --exclude="vendor/*" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/magento2/

      # 5️⃣ Fix permissions & run Magento commands
      - name: Post-deploy Magento commands
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo chown -R www-data:www-data /var/www/magento2

            cd /var/www/magento2

            sudo -u www-data php bin/magento setup:upgrade
            sudo -u www-data php bin/magento cache:flush
            sudo -u www-data php bin/magento indexer:reindex

            sudo systemctl reload nginx
          EOF
